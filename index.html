<body class="landing-page site-settings-loading">
  <!-- Fullscreen Cinema Looping Video & Overlays -->
  <div class="video-background-wrapper">
    <video id="bg-video" autoplay loop muted playsinline preload="auto">
      <source src="assets/videos/bg-cinema.mp4" type="video/mp4" data-site-setting="landing-background-video">
    </video>
    <div class="video-overlay"></div>
    <div class="projection-beam"></div>

      </p>
      
      <div class="action-wrapper">
        <a href="/work" class="enter-btn" id="enter-button" aria-label="Enter portfolio">

        </a>
        <button class="enter-btn watch-reel-btn" id="watch-reel-button" type="button" aria-label="Watch reel" aria-pressed="false">
          <span class="btn-text" data-text="WATCH REEL" data-site-setting="landing-watch-reel-label">WATCH REEL</span>
        </button>
      </div>
    </div>
