<body class="page-scrollable contact-page">
  <div class="cursor-shadow" id="cursor-shadow"></div>

  <!-- Navigation Header -->
  <header class="nav-header">
    <a href="index.html" class="nav-brand" data-text="ARTUR ARAUJO" aria-label="ARTUR ARAUJO — home">ARTUR ARAUJO</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu" aria-controls="nav-menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav>
      <ul class="nav-menu" id="nav-menu"></ul>
    </nav>
  </header>

  <main class="page-container contact-page-container">
    <header class="contact-page-header">
      <p class="contact-page-kicker">CONTACT</p>
      <h1 class="contact-page-title" data-site-setting="contact-title">LET'S WORK TOGETHER</h1>
      <p class="contact-page-intro" data-site-setting="contact-intro">Available for film productions, VFX projects and creative consulting.</p>
    </header>

    <div class="contact-wrapper">
      <aside class="contact-info" aria-label="Contact information">
        <div class="contact-info-item">
          <span class="contact-info-label">STATUS</span>
          <span class="contact-info-value" data-site-setting="contact-availability">AVAILABLE FOR NEW PROJECTS</span>
        </div>
        <div class="contact-info-item">
          <span class="contact-info-label">LOCATION</span>
          <span class="contact-info-value" data-site-setting="contact-location">SÃO PAULO / REMOTE WORLDWIDE</span>
        </div>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="contact-instagram-link" data-site-setting="footer-instagram-url">
          <span data-site-setting="footer-instagram-label">INSTAGRAM</span>
          <span aria-hidden="true">↗</span>
        </a>
      </aside>

      <form class="contact-form" id="contact-form" novalidate aria-describedby="contact-form-status">
        <div class="form-group">
          <label class="form-label" for="name">YOUR NAME / COMPANY</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="E.g. Maria Silva / Production Company" minlength="2" maxlength="100" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">YOUR CONTACT EMAIL</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="email@domain.com" maxlength="254" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="category">PROJECT CATEGORY</label>
          <div class="contact-category-fields" id="contact-category-fields">
            <select id="category" name="category" class="form-select" required>
              <option value="" disabled selected>SELECT A SERVICE</option>
              <option value="vfx" data-site-setting="contact-category-vfx">VFX & COMPOSITING</option>
              <option value="editing" data-site-setting="contact-category-editing">CONTENT EDITING</option>
              <option value="alchemy" data-site-setting="contact-category-alchemy">DIGITAL ALCHEMY & 3D SIMULATION</option>
              <option value="full" data-site-setting="contact-category-full">POST-PRODUCTION DIRECTION</option>
              <option value="other" data-site-setting="contact-category-other">OTHER</option>
            </select>
            <input type="text" id="category-other" name="categoryOther" class="form-input contact-category-other" placeholder="ENTER A CATEGORY" aria-label="Other project category" minlength="2" maxlength="80" autocomplete="off" hidden>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">PROJECT DETAILS & DEADLINE</label>
          <textarea id="message" name="message" class="form-textarea" placeholder="Briefly describe the project, scope and expected timeline..." minlength="20" maxlength="5000" required></textarea>
        </div>

        <div class="contact-honeypot" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="submit-btn" data-site-setting="contact-submit-label">SEND MESSAGE</button>
        <p id="contact-form-status" class="contact-form-status" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </main>

  <script src="config/page-configs.js?v=20260804-sections-2"></script>

  <script src="data/supabase-service.js?v=20260804-youtube"></script>

  <script src="script.js?v=20260805-mobile-readiness"></script>
</body>
</html>
