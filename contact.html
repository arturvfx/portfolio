  <meta name="description" content="Entre em contato com Artur Araujo para projetos de VFX, edição e direção 3D.">

  <meta property="og:site_name" content="ARTUR ARAUJO">
  <meta property="og:title" content="ARTUR ARAUJO | Contact">
  <meta property="og:description" content="Entre em contato com Artur Araujo para projetos de VFX, edição e direção 3D.">
  <meta property="og:url" content="https://arturaraujo.com/contact">

  <link rel="canonical" href="https://arturaraujo.com/contact">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

</head>
<body class="page-scrollable contact-page">
  <!-- Navigation Header -->
  <header class="nav-header">
    <a href="/" class="nav-brand" data-text="ARTUR ARAUJO" aria-label="ARTUR ARAUJO — home">ARTUR ARAUJO</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu" data-i18n-aria-label="openMenu" aria-controls="nav-menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav>
      <ul class="nav-menu" id="nav-menu"></ul>
    </nav>
  </header>

  <main class="page-container contact-page-container">
    <header class="contact-page-header">
      <p class="contact-page-kicker" data-i18n="contact">CONTATO</p>
      <h1 class="contact-page-title" data-site-setting="contact-title">VAMOS TRABALHAR JUNTOS</h1>
      <p class="contact-page-intro" data-site-setting="contact-intro">Disponível para produções audiovisuais, projetos de VFX e consultoria criativa.</p>
    </header>

    <div class="contact-wrapper">
      <aside class="contact-info" aria-label="Informações de contato" data-i18n-aria-label="contactInformation">
        <div class="contact-info-item">
          <span class="contact-info-label" data-i18n="status">STATUS</span>
          <span class="contact-info-value" data-site-setting="contact-availability">DISPONÍVEL PARA NOVOS PROJETOS</span>
        </div>
        <div class="contact-info-item">
          <span class="contact-info-label" data-i18n="location">LOCALIZAÇÃO</span>
          <span class="contact-info-value" data-site-setting="contact-location">SÃO PAULO / REMOTO PARA TODO O MUNDO</span>
        </div>
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="contact-instagram-link" data-site-setting="footer-instagram-url">
          <span data-site-setting="footer-instagram-label">INSTAGRAM</span>
          <span aria-hidden="true">↗</span>
        </a>
      </aside>

      <form class="contact-form" id="contact-form" novalidate aria-describedby="contact-form-status">
        <div class="form-group">
          <label class="form-label" for="name" data-i18n="yourName">SEU NOME / EMPRESA</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Ex.: Maria Silva / Produtora" data-i18n-placeholder="namePlaceholder" minlength="2" maxlength="100" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email" data-i18n="yourEmail">SEU E-MAIL DE CONTATO</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="email@domain.com" maxlength="254" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="category" data-i18n="projectCategory">CATEGORIA DO PROJETO</label>
          <div class="contact-category-fields" id="contact-category-fields">
            <select id="category" name="category" class="form-select" required>
              <option value="" disabled selected data-i18n="selectService">SELECIONE UM SERVIÇO</option>
              <option value="vfx" data-site-setting="contact-category-vfx">VFX E COMPOSIÇÃO</option>
              <option value="editing" data-site-setting="contact-category-editing">EDIÇÃO DE CONTEÚDO</option>
              <option value="alchemy" data-site-setting="contact-category-alchemy">ALQUIMIA DIGITAL E SIMULAÇÃO 3D</option>
              <option value="full" data-site-setting="contact-category-full">DIREÇÃO DE PÓS-PRODUÇÃO</option>
              <option value="other" data-site-setting="contact-category-other">OUTRO</option>
            </select>
            <input type="text" id="category-other" name="categoryOther" class="form-input contact-category-other" placeholder="DIGITE UMA CATEGORIA" data-i18n-placeholder="enterCategory" aria-label="Outra categoria" data-i18n-aria-label="otherCategory" minlength="2" maxlength="80" autocomplete="off" hidden>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="message" data-i18n="projectDetails">DETALHES E PRAZO DO PROJETO</label>
          <textarea id="message" name="message" class="form-textarea" placeholder="Descreva brevemente o projeto, o escopo e o prazo esperado..." data-i18n-placeholder="projectDetailsPlaceholder" minlength="20" maxlength="5000" required></textarea>
        </div>

        <div class="contact-honeypot" aria-hidden="true">
          <label for="website">Website</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="submit-btn" data-site-setting="contact-submit-label">ENVIAR MENSAGEM</button>
        <p id="contact-form-status" class="contact-form-status" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </main>

  <script src="config/page-configs.js?v=20260827-i18n"></script>

  <script src="data/supabase-service.js?v=20260827-i18n"></script>
  <script src="components/contact-form.js?v=20260827-i18n"></script>
  <script src="script.js?v=20260827-i18n"></script>
</body>
</html>
