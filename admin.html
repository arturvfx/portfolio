<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Portfolio Control Panel</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    /* ── Reset & Base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1014;
      --bg-surface: #181a20;
      --bg-raised:  #1f2128;
      --bg-hover:   #272a33;
      --bg-selected:#252b3a;
      --border:     rgba(255,255,255,0.08);
      --border-focus: rgba(99,140,255,0.6);
      --text-primary:   #e8eaf0;
      --text-secondary: #8a8ea8;
      --text-muted:     #555870;
      --accent:     #638cff;
      --accent-dim: rgba(99,140,255,0.15);
      --success:    #3ecf8e;
      --success-dim:rgba(62,207,142,0.12);
      --warning:    #f5a623;
      --error:      #e05c5c;
      --error-dim:  rgba(224,92,92,0.12);
      --tag-bg:     rgba(255,255,255,0.07);
      --radius:     6px;
      --radius-sm:  4px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
    }

    .auth-gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg);
    }

    .auth-gate[hidden] { display: none; }

    .auth-card {
      width: min(400px, 100%);
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      box-shadow: 0 24px 80px rgba(0,0,0,0.45);
    }

    .auth-title {
      margin-bottom: 0.35rem;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-description {
      margin-bottom: 1.5rem;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .auth-fields { display: grid; gap: 1rem; }
    .auth-actions { margin-top: 1.25rem; display: flex; align-items: center; gap: 0.75rem; }
    .auth-actions .btn { flex-shrink: 0; }

    #auth-error {
      color: var(--error);
      font-size: 11px;
    }

    #auth-user {
      color: var(--text-muted);
      font-size: 10px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Layout ───────────────────────────────────────────── */
    .admin-layout {
      display: grid;
      grid-template-rows: auto auto auto;
      grid-template-columns: 340px 1fr;
      grid-template-areas:
        "topbar  topbar"
        "notice  notice"
        "sidebar main";
      min-height: 100vh;
      height: auto;
      overflow: visible;
      align-content: start;
    }

    /* ── Top Bar ──────────────────────────────────────────── */
    .topbar {
      grid-area: topbar;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.65rem 1rem;
      min-height: 58px;
    }

    .topbar-brand {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .topbar-brand .brand-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .topbar-brand .brand-sub {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .topbar-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
    }

    .topbar-section-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .topbar-section-select {
      width: min(240px, 25vw);
      min-width: 170px;
      padding: 0.4rem 2rem 0.4rem 0.65rem;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .topbar-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
      align-items: center;
    }

    .topbar-workspace {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 0.5rem;
    }

    .topbar-section-tools {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-icon {
      width: 34px;
      padding-inline: 0;
      text-align: center;
    }

    .admin-menu {
      position: relative;
    }

    .admin-menu summary {
      list-style: none;
      user-select: none;
    }

    .admin-menu summary::-webkit-details-marker { display: none; }

    .admin-menu[open] summary {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .admin-menu-panel {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      z-index: 200;
      display: grid;
      width: 220px;
      gap: 0.45rem;
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
      box-shadow: 0 18px 45px rgba(0,0,0,0.42);
    }

    .admin-menu-panel .btn {
      width: 100%;
      text-align: left;
    }

    .admin-menu-label {
      padding: 0.2rem 0.35rem;
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    #admin-status {
      display: none;
      position: fixed;
      top: 70px;
      right: 1rem;
      z-index: 300;
      font-size: 12px;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-sm);
      max-width: min(440px, calc(100vw - 2rem));
      white-space: pre-wrap;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
    }

    .status-success { background: var(--success-dim); color: var(--success); }
    .status-error   { background: var(--error-dim);   color: var(--error);   }
    .status-info    { background: var(--accent-dim);  color: var(--accent);  }

    /* ── Override Notice ──────────────────────────────────── */
    .override-notice {
      grid-area: notice;
      padding: 0.45rem 1.25rem;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .override-active { background: rgba(245,166,35,0.1); color: var(--warning); }
    .override-source { background: rgba(62,207,142,0.08); color: var(--success); }

    /* ── Sidebar — Project List ───────────────────────────── */
    .sidebar {
      grid-area: sidebar;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    .sidebar-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    #admin-project-list {
      list-style: none;
      overflow: visible;
      flex: 1;
    }

    .project-list-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .project-list-item:hover { background: var(--bg-hover); }
    .project-list-item.selected { background: var(--bg-selected); border-left: 2px solid var(--accent); }
    .project-list-item.is-dragging { opacity: 0.32; }
    .project-list-item.drag-before { box-shadow: inset 0 2px 0 var(--accent); }
    .project-list-item.drag-after { box-shadow: inset 0 -2px 0 var(--accent); }

    .list-item-thumb {
      width: 60px;
      height: 38px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--bg-raised);
      display: grid;
      place-items: center;
    }

    .list-item-thumb img,
    .list-item-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .list-thumb-empty {
      color: var(--text-muted);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .list-item-info {
      flex: 1;
      min-width: 0;
    }

    .list-item-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
      margin-bottom: 0.2rem;
    }

    .list-item-client {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 0.2rem;
    }

    .list-item-meta {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      background: var(--tag-bg);
      color: var(--text-secondary);
    }

    .tag-pub   { background: var(--success-dim); color: var(--success); }
    .tag-unpub { background: var(--error-dim); color: var(--error); }

    .project-drag-handle {
      width: 28px;
      height: 38px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      cursor: grab;
      font-size: 18px;
      line-height: 1;
      user-select: none;
    }

    .project-drag-handle:hover,
    .project-drag-handle:focus-visible {
      color: var(--text-primary);
      background: var(--bg-raised);
      border-color: var(--border);
      outline: none;
    }

    .project-drag-handle:active { cursor: grabbing; }

    .list-empty {
      padding: 2rem 1rem;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
    }

    /* ── Main — Edit Panel ────────────────────────────────── */
    .main-panel {
      grid-area: main;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    #admin-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 0.5rem;
    }

    .empty-icon { font-size: 2rem; opacity: 0.3; }
    .empty-label { font-size: 12px; letter-spacing: 0.05em; }

    #admin-form-wrap {
      display: none;
      flex: 1;
      overflow: visible;
      padding: 1.5rem;
    }

    /* ── Edit Form ────────────────────────────────────────── */
    .form-header {
      margin-bottom: 1.25rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--border);
    }

    .form-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-title span {
      color: var(--text-primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-group[hidden] { display: none; }

    .form-group.span-2 { grid-column: span 2; }
    .span-2 { grid-column: span 2; }

    .form-card {
      grid-column: 1 / -1;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-surface);
    }

    .form-card + .form-card { margin-top: 0.25rem; }

    .form-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }

    .form-card-title {
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .form-card-description {
      color: var(--text-muted);
      font-size: 10px;
      text-align: right;
    }

    .form-card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-section-heading {
      grid-column: span 2;
      margin-top: 0.5rem;
      padding: 0.75rem 0 0.15rem;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .form-subsection-heading {
      margin: 0.25rem 0 0;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .media-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
      align-items: center;
    }

    .media-input-row .btn { white-space: nowrap; }
    .media-file-input { display: none; }

    .media-upload-note {
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .gallery-media-workspace {
      grid-column: span 2;
      display: grid;
      grid-template-columns: minmax(20rem, 0.8fr) minmax(34rem, 1.2fr);
      align-items: start;
      gap: 1rem;
    }

    .gallery-media-fields {
      display: grid;
      gap: 1rem;
    }

    .mobile-focus-panel {
      min-width: 0;
      padding: 0.85rem;
      border: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .mobile-focus-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .mobile-focus-reset {
      padding: 0.3rem 0.65rem;
      font-size: 10px;
    }

    .mobile-focus-editor {
      display: grid;
      grid-template-columns: minmax(8rem, 10rem) minmax(12rem, 18rem);
      align-items: center;
      justify-content: start;
      gap: 1rem;
    }

    .mobile-focus-preview {
      position: relative;
      width: min(100%, 10rem);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #08090c;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
    }

    .mobile-focus-media,
    .mobile-focus-media img,
    .mobile-focus-media video {
      display: block;
      width: 100%;
      height: 100%;
    }

    .mobile-focus-media img,
    .mobile-focus-media video {
      object-fit: cover;
      pointer-events: none;
    }

    .mobile-focus-empty {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      padding: 1rem;
      color: var(--text-muted);
      font-size: 10px;
      text-align: center;
      text-transform: uppercase;
    }

    .mobile-focus-marker {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.75);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .mobile-focus-marker::before,
    .mobile-focus-marker::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }

    .mobile-focus-marker::before { width: 24px; height: 1px; }
    .mobile-focus-marker::after { width: 1px; height: 24px; }

    .mobile-focus-controls {
      display: grid;
      width: 100%;
      max-width: 18rem;
      gap: 0.45rem;
    }

    .mobile-focus-controls label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .mobile-focus-controls output {
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .mobile-focus-controls input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .project-stills-editor {
      grid-column: span 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .project-still-slot {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 0.55rem;
      padding: 0.85rem;
      border: 1px solid var(--border);
      background: var(--bg-surface);
    }

    .project-still-slot .media-input-row {
      grid-template-columns: minmax(0, 1fr);
    }

    .project-still-preview {
      display: grid;
      width: 100%;
      height: 132px;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #090a0d;
    }

    .project-still-preview img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .project-still-preview-empty {
      padding: 0.75rem;
      color: var(--text-muted);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    .project-still-actions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.5rem;
      align-items: center;
    }

    label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    input[type="password"],
    textarea,
    select {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13px;
      padding: 0.5rem 0.7rem;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea {
      min-height: 5rem;
      line-height: 1.5;
      resize: vertical;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    textarea:focus,
    select:focus {
      border-color: var(--border-focus);
    }

    select option { background: var(--bg-raised); }

    /* ── Form Actions ─────────────────────────────────────── */
    .form-actions {
      position: sticky;
      bottom: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 0 -1.5rem -1.5rem;
      padding: 0.85rem 1.5rem;
      border-top: 1px solid var(--border);
      background: rgba(15,16,20,0.97);
      box-shadow: 0 -12px 28px rgba(0,0,0,0.22);
    }

    .form-dirty-hint {
      font-size: 11px;
      color: var(--warning);
      margin-left: auto;
    }

    .form-dirty-hint.is-saved { color: var(--success); }
    .form-dirty-hint.is-error { color: var(--error); }

    .form-action-spacer { flex: 1; }

    /* ── Buttons ──────────────────────────────────────────── */
    .btn {
      padding: 0.5rem 1.1rem;
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .btn-primary:hover { background: #7aa5ff; }
    .btn:disabled { cursor: wait; opacity: 0.62; }

    .btn-secondary {
      background: var(--bg-raised);
      color: var(--text-secondary);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--bg-hover); color: var(--text-primary); }

    .btn-danger {
      background: transparent;
      color: var(--error);
      border-color: rgba(224,92,92,0.3);
    }
    .btn-danger:hover { background: var(--error-dim); }

    /* ── Scrollbar ────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    @media (max-width: 1050px) {
      .admin-layout {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .topbar {
        flex-wrap: wrap;
      }

      .topbar-actions { margin-left: 0; }
      .topbar-workspace { flex: 1; }

      .gallery-media-workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .admin-layout {
        grid-template-columns: 1fr;
        grid-template-areas:
          "topbar"
          "notice"
          "sidebar"
          "main";
      }

      .topbar {
        position: relative;
        align-items: stretch;
      }

      .topbar-brand {
        width: 100%;
        padding-bottom: 0.55rem;
        border-bottom: 1px solid var(--border);
      }

      .topbar-sep,
      .topbar-section-label { display: none; }

      .topbar-workspace,
      .topbar-actions {
        width: 100%;
      }

      .topbar-section-select {
        width: 100%;
        min-width: 0;
        flex: 1;
      }

      .topbar-actions { justify-content: flex-end; }

      #admin-status {
        top: 1rem;
        left: 1rem;
        right: 1rem;
      }

      .sidebar {
        max-height: 38vh;
        overflow: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      #admin-project-list { overflow: visible; }

      #admin-form-wrap { padding: 1rem; }

      .form-grid,
      .form-card-grid,
      .project-stills-editor,
      .gallery-media-workspace,
      .mobile-focus-editor {
        grid-template-columns: 1fr;
      }

      .form-group.span-2,
      .span-2,
      .project-stills-editor,
      .gallery-media-workspace,
      .form-section-heading { grid-column: span 1; }

      .form-card-header {
        display: block;
      }

      .form-card-description {
        margin-top: 0.25rem;
        text-align: left;
      }

      .form-actions {
        margin: 0 -1rem -1rem;
        padding: 0.75rem 1rem;
        flex-wrap: wrap;
      }

      .form-dirty-hint {
        width: 100%;
        margin-left: 0;
        order: -1;
      }

      .form-action-spacer { display: none; }
    }
  </style>
</head>
<body>

<div id="auth-gate" class="auth-gate" aria-live="polite">
  <form id="auth-form" class="auth-card" novalidate>
    <h1 class="auth-title">Portfolio Admin</h1>
    <p class="auth-description" id="auth-description">Sign in with the administrator account configured in Supabase.</p>
    <div class="auth-fields">
      <div class="form-group">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" required>
      </div>
    </div>
    <div class="auth-actions">
      <button id="btn-login" class="btn btn-primary" type="submit">Sign In</button>
      <span id="auth-error" role="alert"></span>
    </div>
  </form>
</div>

<div class="admin-layout">

  <!-- ── Top Bar ──────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-title">Portfolio Control</span>
      <span class="brand-sub">Local backup enabled — sign in to sync with Supabase</span>
    </div>

    <div class="topbar-sep"></div>
    <div class="topbar-workspace">
      <label class="topbar-section-label" for="section-select">Section</label>
      <select id="section-select" class="topbar-section-select" aria-label="Portfolio section">
        <option value="featured-work">Featured Work</option>
      </select>
      <div class="topbar-section-tools" aria-label="Section controls">
        <button id="btn-edit-section" class="btn btn-secondary" type="button">Edit</button>
        <button id="btn-section-up" class="btn btn-secondary btn-icon" type="button" title="Move section up" aria-label="Move section up">↑</button>
        <button id="btn-section-down" class="btn btn-secondary btn-icon" type="button" title="Move section down" aria-label="Move section down">↓</button>
      </div>
    </div>

    <div class="topbar-actions">
      <div id="admin-status" class="status-bar" role="status" aria-live="polite"></div>
      <button id="btn-new-project" class="btn btn-primary" type="button">＋ New Project</button>
      <button id="btn-site-settings" class="btn btn-secondary" type="button">Site Settings</button>
      <details class="admin-menu">
        <summary class="btn btn-secondary">More</summary>
        <div class="admin-menu-panel">
          <span class="admin-menu-label">Sections</span>
          <button id="btn-new-section" class="btn btn-secondary" type="button">＋ New Section</button>
          <button id="btn-delete-section" class="btn btn-danger" type="button">Delete Current Section</button>
          <span class="admin-menu-label">Data &amp; account</span>
          <span id="auth-user"></span>
          <button id="btn-migrate-supabase" class="btn btn-primary" type="button" style="display:none">Sync All to Supabase</button>
          <button id="btn-export" class="btn btn-secondary" type="button">↓ Export JSON</button>
          <button id="btn-import" class="btn btn-secondary" type="button">↑ Import JSON</button>
          <button id="btn-reset" class="btn btn-danger" type="button">↺ Reset Local Backup</button>
          <button id="btn-logout" class="btn btn-secondary" type="button" style="display:none">Sign Out</button>
        </div>
      </details>
      <input id="import-file-input" type="file" accept=".json,application/json" style="display:none" aria-label="Import JSON file">
    </div>
  </header>

  <!-- ── Override Notice ──────────────────────────────────── -->
  <div id="override-notice" class="override-notice override-source" role="status">
    Checking override status…
  </div>

  <!-- ── Sidebar — Project List ───────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      Projects — click to edit · drag to reorder
    </div>
    <ul id="admin-project-list" role="list" aria-label="Featured Work project list"></ul>
  </aside>

  <!-- ── Main — Edit Panel ────────────────────────────────── -->
  <main class="main-panel" aria-label="Project editor">

    <div id="admin-empty-state" role="status">
      <span class="empty-icon">◻</span>
      <span class="empty-label">Select a project to edit</span>
    </div>

    <div id="admin-form-wrap">
      <form id="admin-edit-form" novalidate aria-labelledby="form-heading"></form>
    </div>

  </main>

</div>

<script src="../admin/admin.js?v=20260826-work-overview"></script>

</body>
</html>
